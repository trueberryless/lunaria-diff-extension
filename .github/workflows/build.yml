name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build and zip
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Set job summary
        run: |
          echo "$(ls -lhp .output/ | grep -v '/$' | awk '{print $5, $9}')" >> $GITHUB_STEP_SUMMARY

      - name: Upload compiled Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: lunaria-diff-extension-chrome
          path: .output/chrome-mv3

      - name: Upload compiled Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: lunaria-diff-extension-firefox
          path: .output/firefox-mv2

  supply-chain:
    name: Socket Firewall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # No package manager cache here: cached packages would never pass through the firewall.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.7.0

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies through Socket Firewall
        run: sfw pnpm install --frozen-lockfile --ignore-scripts
