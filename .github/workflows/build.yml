name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build and zip
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Set job summary
        run: |
          echo "$(ls -lhp .output/ | grep -v '/$' | awk '{print $5, $9}')" >> $GITHUB_STEP_SUMMARY

      - name: Upload compiled Chrome extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lunaria-diff-extension-chrome
          path: .output/chrome-mv3

      - name: Upload compiled Firefox extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lunaria-diff-extension-firefox
          path: .output/firefox-mv2
